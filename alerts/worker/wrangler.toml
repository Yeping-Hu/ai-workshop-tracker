# Cloudflare Worker "aiwt-alerts" — the entire backend for email alerts.
#
# This is the ONLY server-side component in the project. The tracker itself
# stays a static build; delete this directory and the site is unchanged (see
# docs/ARCHITECTURE.md, "Email alerts (optional satellite)").
#
# First-time setup (maintainer — see docs/plans/email-alerts.md §9):
#   npx wrangler d1 create aiwt-alerts        # then paste the id below
#   npx wrangler d1 execute aiwt-alerts --remote --file=./schema.sql
#   npx wrangler secret put HMAC_SECRET       # 32+ random bytes, hex
#   npx wrangler secret put ADMIN_TOKEN       # shared with the GitHub Action
#   npx wrangler secret put TURNSTILE_SECRET
#   npx wrangler secret put RESEND_API_KEY
#   npx wrangler secret put RESEND_WEBHOOK_SECRET
#   npx wrangler deploy

name = "aiwt-alerts"
main = "src/index.mjs"
compatibility_date = "2026-08-01"

# Answer on the site's own domain, and never on workers.dev.
#
# Not cosmetic. Confirmation emails are short messages whose single call to
# action is an opaque-token link, and while that link pointed at
# *.workers.dev — a free subdomain widely abused for phishing — a national-lab
# mail filter quarantined every one of them. Sign-in emails, identical in shape
# but linking to aiworkshoptracker.com, arrived from the same sender in the same
# minute. Unsubscribe links and the List-Unsubscribe header carry the same
# origin, so this affects every message, not just confirmations.
#
# `workers_dev = false` keeps the old hostname from being republished by
# accident; the route below requires the zone to live in this same account,
# which is why the Worker was moved here.
workers_dev = false

[[routes]]
pattern = "api.aiworkshoptracker.com"
custom_domain = true

# Persist logs. Every endpoint here answers neutrally on purpose — none will
# admit whether an address is on the list — so when a row is gone there is
# nothing to read back, and `wrangler tail` is live-only and cannot answer a
# question asked after the event. That leaves reasoning backwards from which
# code paths can reach a DELETE, which is slow and, done from a single read of
# a table someone is still changing, easy to get wrong. Logs carry no
# addresses: the webhook handler records an event type and a domain.
[observability]
enabled = true
head_sampling_rate = 1

[[d1_databases]]
binding = "DB"
database_name = "aiwt-alerts"
# Created 2026-08-17 with `wrangler d1 create aiwt-alerts` (region WNAM), in the
# Cloudflare account that owns aiworkshoptracker.com. An identifier, not a
# credential — useless without an account token — which is why it belongs here.
#
# The Worker lived in a second account until 2026-08-17, on a *.workers.dev
# hostname. A national-lab mail filter quarantined every confirmation email,
# because its one call to action was an opaque-token link on a free hosting
# subdomain — the exact shape of a credential-phishing message. Sign-in emails,
# whose button points at aiworkshoptracker.com, arrived from the same sender in
# the same minute. A Worker custom domain requires the zone in the same account,
# so the Worker moved here and now answers on api.aiworkshoptracker.com.
database_id = "e6831c9d-452a-4a25-a2d3-04e5c46fc8e5"

[vars]
# The maintainer's dashboard at /dashboard is authenticated by Cloudflare
# Access, and the Worker verifies the token Access issues (src/access.mjs).
# Both values below are public identifiers, not credentials — the audience tag
# names an application, it does not grant entry to one.
#
# Until they are filled in, /dashboard refuses every request: an unconfigured
# deploy must not be an open one. Set them from
#   Zero Trust -> Access -> Applications -> (the app) -> Overview
# ACCESS_TEAM is the subdomain of <team>.cloudflareaccess.com.
ACCESS_TEAM = "aiworkshoptracker"
ACCESS_AUD = "6476b631eb5635f2832d67b8e48cba17d60931f3024922b4145f6a96e9ee9e94"

# Which GoatCounter site the dashboard reads. The matching API token is a
# secret (`wrangler secret put GOATCOUNTER_TOKEN`) and is used server-side only
# — in page JavaScript it would be readable by anyone who opened the dashboard.
GOATCOUNTER_SITE = "aiworkshoptracker"

SITE_ORIGIN = "https://aiworkshoptracker.com"
# A dedicated subdomain so the apex domain's sending reputation is never at
# risk (decision D7). Must be verified in Resend with SPF/DKIM/DMARC published.
MAIL_FROM = "AI Workshop Tracker <alerts@mail.aiworkshoptracker.com>"

# `wrangler dev` only: allows the local Astro dev server through CORS.
[env.dev.vars]
SITE_ORIGIN = "https://aiworkshoptracker.com"
MAIL_FROM = "AI Workshop Tracker <alerts@mail.aiworkshoptracker.com>"
DEV = "1"
