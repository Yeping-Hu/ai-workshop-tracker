# Deploys the alerts Worker when its source changes.
#
# The Worker is the only server-side component in the project; everything else
# is a static build. It bundles alerts/*.mjs and alerts/ids.json from the repo
# root, so a change to the shared logic redeploys it too.
#
# Schema changes are NOT applied here — `wrangler d1 execute` against production
# is a deliberate, manual step (see docs/ALERTS.md). An automated migration on
# every push is how a subscriber table gets dropped by a typo.
name: Deploy alerts worker

on:
  push:
    branches: [main]
    paths:
      - 'alerts/**'
      # render.mjs imports this, so it is inside the Worker bundle. Without it
      # here, a change to the display rule would ship to the site and leave the
      # digest running the old one.
      - 'lib/identity.mjs'
      # render.mjs imports this too — same reason as above.
      - 'lib/events.mjs'
      - '.github/workflows/alerts-worker-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alerts-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.repository_owner == 'Yeping-Hu'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The vocabulary the Worker validates against is generated from data/;
      # deploying a stale copy would silently reject a newly added conference.
      - run: npm ci
      - name: Check alerts/ids.json is in sync with data/
        run: node scripts/gen_alerts_ids.mjs --check

      # `--env=""` targets the top-level environment explicitly. wrangler.toml
      # also defines [env.dev] for local work, and without the flag wrangler
      # warns that the target is ambiguous — which in CI is one upgrade away
      # from deploying the wrong environment silently.
      - name: Deploy
        working-directory: alerts/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --env=""
