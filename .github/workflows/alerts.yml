# Daily email-alerts pipeline.
#
# Diffs the freshly deployed /api/workshops.json against yesterday's snapshot,
# records what changed, sends urgent starred-deadline alerts, and on Mondays
# sends the weekly digests.
#
# Timing matters: deploy.yml's daily rebuild runs at 05:17 UTC and is what makes
# today's workshops.json exist. This job runs at 06:30 UTC — 73 minutes later —
# so it always diffs the rebuilt feed, never yesterday's. If deploy.yml's cron
# moves, move this one with it.
#
# This job commits exactly one file, data/changes.json, on the weekly pass. It
# still stays OUT of the `data-write` concurrency group (see docs/AUTOMATION.md):
# queueing behind a slow discovery run would only delay mail, and the publish
# action's rebase-retry absorbs a collision. It has its own group.
name: Email alerts

on:
  schedule:
    - cron: '30 6 * * *' # daily 06:30 UTC, ≥60 min after deploy.yml's 05:17
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Render and report without sending anything'
        type: boolean
        default: true
      force_weekly:
        description: 'Run the weekly digest pass even if today is not Monday'
        type: boolean
        default: false

permissions:
  # write, only to commit data/changes.json — the week's events, which the
  # static site build cannot read from D1. Nothing else in this job writes to
  # the repo, and the commit step below is pinned to that one path.
  contents: write
  # A push made with GITHUB_TOKEN does not trigger `on: push`, so the commit
  # below has to kick deploy.yml explicitly or the new feed sits on main
  # unbuilt until the next daily deploy — a ~23h lag on a page headed "this
  # week". Same reason discover.yml holds this permission.
  actions: write

concurrency:
  group: alerts
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Skipped entirely in forks and wherever the feature is unconfigured, so a
    # fork's Actions tab isn't full of red runs it can never fix.
    if: github.repository_owner == 'Yeping-Hu'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Workflow logs on a public repo are public, so the script prints dataset
      # facts only — workshops, events, slugs — and withholds anything derived
      # from the subscriber list: no addresses, no counts, and no per-recipient
      # lines (their number would be the count). Set ALERTS_VERBOSE=1 when
      # running it locally for the full detail; never here.
      - name: Run the alerts pipeline
        env:
          ALERTS_API_BASE: ${{ secrets.ALERTS_API_BASE }}
          ALERTS_ADMIN_TOKEN: ${{ secrets.ALERTS_ADMIN_TOKEN }}
          # A scheduled run always sends; a manual one defaults to a dry run.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          FORCE_WEEKLY: ${{ inputs.force_weekly && '1' || '0' }}
        run: node scripts/alerts_run.mjs

      # The public /changes/ page reads this file at build time. Committing it
      # is what makes "one diff computation, two consumers" true: the page and
      # the Monday digest render the same array rather than each deriving its
      # own idea of what changed.
      #
      # Scoped to the single path on purpose — `git add data/changes.json`, not
      # `-A` — so a stray file written by any future step can never ride along
      # into an automated commit. A quiet week rewrites the same content, git
      # reports no diff, and the step exits without committing.
      # Validate BEFORE committing, the way discover.yml does — and for a
      # reason specific to how this job pushes. A push made with GITHUB_TOKEN
      # does not trigger `on: push`, so validate.yml never runs on the commit
      # below: the feed would reach main and the live page without the schema
      # check that scripts/validate_changes_feed.mjs exists to apply. Running it
      # here is the only place it can gate this path.
      #
      # A failure fails the job with nothing committed, which is the right
      # outcome: a malformed feed is worse than a stale one, and the page
      # renders the previous window until the next run fixes it.
      - name: Validate before publishing
        run: node scripts/validate.mjs

      # Runs on a dry run too. A dry run mails nobody — every send in
      # alerts_run.mjs funnels through one `send()` helper that returns early
      # when DRY_RUN is set — but the feed it computed is still true, so
      # publishing it is how /changes/ gets refreshed on demand without
      # touching a subscriber. The guard that used to sit here made a dry run
      # compute the right answer and then throw it away.
      - name: Commit this week's changes feed
        uses: ./.github/actions/publish-data
        with:
          paths: data/changes.json
          subject: "data: this week's changes feed (auto-published)"
          nothing-message: 'no change to data/changes.json — nothing to commit'
          token: ${{ github.token }}
