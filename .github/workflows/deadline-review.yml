# Daily: cross-checks OpenReview-backed deadlines against their live duedates
# and keeps exactly ONE consolidated issue up to date with the cases the
# auto-sync will NOT fix on its own — deadlines a human edited that now disagree
# with OpenReview, and bot-managed deadlines OpenReview moved *earlier* (declined
# by the later-only rule). The maintainer resolves each by re-syncing (trust
# OpenReview) or leaving it (keep the stored value).
#
# Daily, not weekly, because this is the ONLY job that ever looks at a
# human-edited deadline: freeze-on-touch removes such an entry from the daily
# re-check, the track sync and the weekly auto-sync alike, so on a weekly cadence
# a hand-curated deadline carried up to 7 days of staleness against ~24h for a
# bot-managed one. It also means a conference-year listing that gets throttled is
# retried tomorrow rather than next week.
name: Deadline review

on:
  schedule:
    # 05:53 UTC — after the day's writers (imminent re-check 04:41, backfill
    # 05:11, track sync 05:31) so the review always reflects what they committed,
    # and so the four jobs are not spending the same OpenReview budget at once.
    # The limiter in lib/openreview.mjs is per-process; staggering is what keeps
    # concurrent jobs apart.
    - cron: '53 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Entries OpenReview could not answer for are named in this job's log and
      # in a "Could not be checked this run" section of the issue itself, so the
      # review owns its own reporting rather than writing into the TSV that
      # discovery's "venues not verified" issue is built from — two workflows
      # maintaining one issue would just take turns closing it. A run in which
      # OpenReview answered nothing at all writes no report file, and the next
      # step then leaves the issue exactly as it was (silentListings()).
      - run: node scripts/deadline_crosscheck.mjs --recent --report deadline-review.md
      - name: Create/update the consolidated issue
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            // No file means OpenReview answered nothing: the script writes one,
            // possibly empty, after every run that checked anything, and a crash
            // fails the step before this one. A blind run has nothing to say, so
            // the issue keeps its items rather than losing them — an empty body
            // here would close it, and tomorrow would open a new one.
            if (!fs.existsSync('deadline-review.md')) {
              console.log('No report this run: OpenReview did not answer, so the issue is left as it was.');
              return;
            }
            const report = fs.readFileSync('deadline-review.md', 'utf8').trim();
            const title = 'Data health: deadlines to review';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'data-health',
              per_page: 100,
            });
            const existing = open.find((i) => i.title === title);
            if (!report) {
              if (existing) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  state: 'closed',
                });
              }
              return;
            }
            if (existing) {
              // Editing an issue body sends NO notification, so a workshop could
              // appear here and sit unread until someone happened to open the
              // issue — which is exactly how a deadline conflict went unseen for
              // nine days. Diff the entry files named by the old body against the
              // new one and comment on whatever is genuinely new; the comment is
              // the part that actually reaches anyone.
              //
              // Only review rows count, and a review row is a checkbox. A "Could
              // not be checked this run" row describes the run rather than the
              // data and carries no box, so a throttled day never pings anyone
              // about hundreds of entries nothing is wrong with. `[x]` is a box
              // somebody ticked, still the same row.
              const named = (text) =>
                new Set([...String(text || '').matchAll(/^- \[[ xX]\] `(data\/workshops\/[\w.-]+\.yml)`/gm)].map((m) => m[1]));
              const before = named(existing.body);
              const added = [...named(report)].filter((f) => !before.has(f));
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: report,
              });
              if (added.length) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body:
                    `New since the last run — ${added.length} entr${added.length === 1 ? 'y' : 'ies'}:\n\n` +
                    added.map((f) => `- \`${f}\``).join('\n') +
                    '\n\nSee the issue body above for the stored vs OpenReview values and the re-sync command.',
                });
              }
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: report,
                labels: ['data-health'],
              });
            }
