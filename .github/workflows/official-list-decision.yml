# On demand: record that one workshop edition is NOT taking place — or undo it.
#
# The case this exists for: OpenReview creates a venue group during a
# conference's *proposal* phase, so a REJECTED proposal keeps a live group with
# an open submission invitation and a ticking duedate. Discovery cannot tell it
# from an accepted workshop, and the site therefore advertises an open call for
# something that will never happen. The weekly official-list check reports the
# candidates; this workflow is how a human acts on one.
#
# Deleting the file does not work — the next weekly crawl re-creates it from the
# still-live group. Marking it is what makes the decision stick, and it keeps the
# page alive for anyone who already saved or linked it.
#
# Use `ack` instead of a reason for an entry that IS running and is merely absent
# from that list: an affinity event, a competition, a co-located workshop.
#
# The same report also flags a name or website that disagrees with the list, and
# the adopt_*/decline_* actions record those. One workflow for all of it, because
# every one of these decisions comes from reading the same issue.
name: Record an official-list decision

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Workshop slug (the data/workshops filename without .yml), e.g. neurips-2026-eiml'
        required: true
        type: string
      action:
        description: 'What to record'
        required: true
        type: choice
        default: not_on_official_list
        options:
          - not_on_official_list   # not running: absent from the official accepted-workshop list
          - withdrawn              # not running: the organizers withdrew it
          - cancelled              # not running: announced and then cancelled
          - ack                    # it IS running; stop reporting it as off-list
          - unmark                 # undo a previous not-running marking
          - adopt_name             # take the official list's title
          - decline_name           # keep ours, remember the title we turned down
          - adopt_website          # take the official list's URL
          - decline_website        # keep ours, remember the URL we turned down
      source:
        description: 'Evidence URL (defaults to the edition''s configured official list)'
        required: false
        type: string
      note:
        description: 'One line shown to readers under the notice on the workshop page'
        required: false
        type: string

concurrency:
  # Serialise every workflow that commits to `main` — see resync-deadline.yml for
  # the full reasoning. This one writes data, so unlike the official-list check
  # (which only reports) it belongs in the group.
  group: data-write
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  mark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Record the decision
        env:
          SLUG: ${{ inputs.slug }}
          ACTION: ${{ inputs.action }}
          SOURCE: ${{ inputs.source }}
          NOTE: ${{ inputs.note }}
        run: |
          set -euo pipefail
          case "$ACTION" in
            adopt_name)      node scripts/apply_official_list.mjs --slug "$SLUG" --field name --adopt ;;
            decline_name)    node scripts/apply_official_list.mjs --slug "$SLUG" --field name --decline ;;
            adopt_website)   node scripts/apply_official_list.mjs --slug "$SLUG" --field website --adopt ;;
            decline_website) node scripts/apply_official_list.mjs --slug "$SLUG" --field website --decline ;;
            *)
              args=(--slug "$SLUG")
              case "$ACTION" in
                ack)    args+=(--ack) ;;
                unmark) args+=(--unmark) ;;
                *)      args+=(--reason "$ACTION") ;;
              esac
              # `if`, not `[ -n … ] && …`: under `set -e` a false test on the LAST
              # command of the step would exit non-zero and fail the job whenever
              # the optional input was left blank.
              if [ -n "$SOURCE" ]; then args+=(--source "$SOURCE"); fi
              if [ -n "$NOTE" ]; then args+=(--note "$NOTE"); fi
              node scripts/mark_not_running.mjs "${args[@]}"
              ;;
          esac
      - name: Validate
        run: node scripts/validate.mjs
      # Validation passed — publish directly. A failed validation fails the job
      # before anything is committed.
      - name: Publish if changed
        uses: ./.github/actions/publish-data
        with:
          paths: data/workshops
          subject: 'data: ${{ inputs.slug }} — ${{ inputs.action }} (manual dispatch)'
          nothing-message: 'No change — that decision was already recorded.'
          token: ${{ github.token }}
