# Daily: re-check only the workshops whose deadline is imminent (within the next
# two weeks) or just passed (within the last week) and apply any OpenReview
# extension immediately — the time-sensitive slice the weekly `discover` crawl
# would otherwise catch up to a week later. One direct OpenReview lookup per
# in-band entry (no enumeration), with the same later-only + freeze-on-touch +
# plausibility gates as the weekly sync. Whatever changed is validated and, on
# success, committed straight to main (and a deploy is dispatched), with each
# change recorded in the commit message. Full venue discovery, multi-track
# descent, and legacy adoption stay weekly (scripts/discover_openreview.mjs);
# this job never enumerates and never adopts.
name: Re-check imminent deadlines

on:
  schedule:
    - cron: '41 4 * * *' # daily 04:41 UTC (after Tue discovery, before Wed review)
  workflow_dispatch:

concurrency:
  # Serialise every workflow that commits to `main`. Each one checks out main,
  # computes, commits and pushes; if a sibling pushes in between, the push is
  # rejected as a non-fast-forward and the job fails with its work computed but
  # unpublished. The crons are 30 minutes apart, but discovery can run ~35
  # minutes on a slow OpenReview day, and a manual dispatch ignores the schedule
  # entirely. `cancel-in-progress: false` queues the second run instead of
  # dropping it, so no data write is ever silently skipped.
  group: data-write
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  recheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Re-check imminent deadlines against OpenReview
        env:
          DEADLINE_CHANGELOG: ${{ github.workspace }}/.deadline-changes.md
        run: node scripts/recheck_imminent.mjs
      - name: Validate
        run: node scripts/validate.mjs
      # Validation passed above — publish directly. A failed validation fails
      # the job before anything is committed (GitHub emails the owner).
      - name: Publish updated deadlines (if any)
        env:
          GH_TOKEN: ${{ github.token }}
          DEADLINE_CHANGELOG: ${{ github.workspace }}/.deadline-changes.md
        run: |
          if [ -z "$(git status --porcelain data/workshops)" ]; then
            echo "No imminent-deadline extensions today."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/workshops
          # Commit message: a fixed subject plus the per-deadline change log
          # (old -> new), so every automated edit is recorded in history rather
          # than applied silently — same convention as the weekly discovery run.
          {
            echo "data: daily imminent-deadline re-check (auto-published after validation)"
            if [ -s "$DEADLINE_CHANGELOG" ]; then
              echo
              echo "Deadline changes synced from OpenReview (later-only):"
              cat "$DEADLINE_CHANGELOG"
            fi
          } > "$RUNNER_TEMP/commit-msg.txt"
          git commit -F "$RUNNER_TEMP/commit-msg.txt"
          # Push with rebase-retry. The concurrency group above should prevent a
          # sibling data job from racing us, but a merge, an admin push or a
          # re-run can still move `main` between checkout and push — so rebase
          # onto whatever landed and try again rather than failing with the work
          # already computed.
          for attempt in 1 2 3; do
            git push && break
            if [ "$attempt" = 3 ]; then
              echo "::error::push failed after 3 attempts (main kept moving)" && exit 1
            fi
            git fetch origin main && git rebase origin/main || exit 1
            sleep $((attempt * 5))
          done
          # Pushes made with GITHUB_TOKEN don't trigger on:push workflows,
          # so kick the deploy explicitly.
          gh workflow run deploy.yml --ref main
