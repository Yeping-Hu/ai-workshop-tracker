# Runs the same install / validate / build steps as the deploy workflow, but
# without deploying — and runs the browser suites, which nothing else does.
# See validate.yml for the data-focused checks; this one guards the site build
# and the site's runtime behaviour.
#
# It runs on pushes to main as well as on pull requests, because work lands here
# by pushing straight to main and a PR-only trigger meant the browser suites
# never ran at all: a push touching only site/** got validate.mjs and a build,
# and not one assertion about the page it shipped. deploy.yml publishes in
# parallel rather than waiting on this, so a red run does not hold the site up;
# it tells you to look, which is the part that was missing.
name: Build check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # Mirror deploy.yml: the sitemap's <lastmod> comes from git history
          # (lastDataChange in lib/workshops.mjs), and a shallow clone would
          # silently fall back to the dates inside the YAML — making this build
          # a poor rehearsal of the real one.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - run: npm ci
      - name: Validate data
        run: node scripts/validate.mjs
      - run: npm ci --prefix site
      - name: Build site
        env:
          SITE_URL: https://aiworkshoptracker.com
          SITE_BASE: /
          PUBLIC_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          BUILD_ID: ${{ github.sha }}
        run: npm run build --prefix site

      # --- UI behavior suite -------------------------------------------------
      # The only guard on the homepage's runtime behaviour: the dual-index
      # search and its merge-immune counts, deterministic result order, the
      # external-vs-internal link rule, back/forward restore, and the
      # deploy-staleness heal. Data changes cannot reach that code, so
      # validate.yml does not cover it — a hand-edit to the search or link code
      # that still compiles would otherwise build and ship with nothing flagging
      # it. It runs here because this job already builds the site with the
      # production env vars, so the suite drives the artefact that would ship.
      - name: Resolve the Playwright version
        id: pw
        run: echo "version=$(node -p "require('./node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache the Chromium build
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # ~150 MB, fetched once per Playwright version and seconds thereafter. The
      # OS libraries are not cacheable and the runner is fresh every time, so
      # they are installed either way: with the browser on a miss, alone on a hit.
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium system libraries
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Serve the built site
        run: |
          npm run preview --prefix site > /tmp/preview.log 2>&1 &
          # Racing the server is the classic way a browser suite goes
          # intermittently red, so wait generously and fail loudly rather than
          # letting the suite open a connection-refused page and report nonsense.
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:4321/; then
              echo "preview ready after ${i}s"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "preview server never answered on :4321 after 60s"
              cat /tmp/preview.log
              exit 1
            fi
            sleep 1
          done
      - name: Test UI behavior (headless Chromium)
        run: node scripts/ui_test.mjs http://localhost:4321

      # --- Alerts signup suite -----------------------------------------------
      # This needs its own build. The build above leaves PUBLIC_ALERTS_API empty,
      # so the alerts UI is absent from that artefact entirely — the correct fork
      # state, and what ui_test.mjs is written against. The two cannot share one
      # build: ui_test.mjs clicks the first `h2` on the homepage, and with alerts
      # configured that is the signup box's heading, inside a collapsed <details>
      # and therefore not clickable.
      #
      # The values below are placeholders and are never reached — the suite stubs
      # /subscribe, aborts the Turnstile script, and nothing else calls the API
      # without a sign-in token. The Turnstile key is Cloudflare's documented
      # always-passes test key. Real values would buy nothing and leak something.
      - name: Rebuild with alerts configured
        env:
          SITE_URL: https://aiworkshoptracker.com
          SITE_BASE: /
          PUBLIC_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          BUILD_ID: ${{ github.sha }}
          PUBLIC_ALERTS_API: https://alerts.example.invalid
          PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
        run: npm run build --prefix site
      - name: Re-serve the built site
        run: |
          pkill -f "astro preview" || true
          sleep 2
          npm run preview --prefix site > /tmp/preview-alerts.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:4321/; then
              echo "preview ready after ${i}s"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "preview server never answered on :4321 after 60s"
              cat /tmp/preview-alerts.log
              exit 1
            fi
            sleep 1
          done
      - name: Test the alerts signup's sent state (headless Chromium)
        run: node scripts/alerts_ui_test.mjs http://localhost:4321
      # Everything ui_test.mjs structurally cannot see. It drives the fork build,
      # where PUBLIC_ALERTS_API is empty and Base.astro therefore emits none of
      # the alerts scripts — so a <head> script that breaks every page on the
      # real site is, in that artefact, not present to break anything. That is
      # how a blanket fragment-clear in alerts-session.js killed every #p-<paper>
      # deep link for twelve days with this job green. Runs against the
      # alerts-configured build above rather than adding a third one.
      - name: Test behaviour only the configured build has (headless Chromium)
        run: node scripts/shipped_ui_test.mjs http://localhost:4321
      # Browser suites fail for timing reasons as well as real ones. If this job
      # goes red, read this before touching the assertions: a server that never
      # came up, or Pagefind's parallel chunk fetches stalling, look nothing like
      # a genuine regression.
      - name: Preview server logs (on failure)
        if: failure()
        run: |
          cat /tmp/preview.log || true
          cat /tmp/preview-alerts.log || true
