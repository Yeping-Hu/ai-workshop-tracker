# Weekly: discover newly announced workshop venues on OpenReview for the
# current and next year, backfill deadlines that organizers published late, and
# keep already-imported deadlines in sync when OpenReview extends them. Whatever
# changed is validated and, on success, committed straight to main (and a deploy
# is dispatched). Per-deadline changes are recorded in the commit message. This
# is how new conference cycles (e.g. the NeurIPS list each July) and deadline
# extensions flow in with zero manual work.
name: Discover new workshop venues

on:
  schedule:
    # Sundays 03:19 UTC — chosen to feed the Monday 06:30 digest, which is what
    # actually tells anyone that a venue was found. This ran on Tuesdays until
    # 2026-08-17, i.e. ~21 hours *after* the digest, so every discovery waited
    # almost a full week to be announced. That was the worst available slot.
    #
    # Not Monday, though it would be fresher still: discovery can take ~35
    # minutes on a slow OpenReview day and holds the `data-write` lock below,
    # so an overrun would queue the 04:41 and 05:11 jobs behind it and push the
    # whole lot past the 05:17 deploy — silently delaying the finds by another
    # week, the exact problem this move exists to fix. Sunday spends ~24h of
    # freshness to remove that failure mode.
    - cron: '19 3 * * 0'
  workflow_dispatch:

concurrency:
  # Serialise every workflow that commits to `main`. Each one checks out main,
  # computes, commits and pushes; if a sibling pushes in between, the push is
  # rejected as a non-fast-forward and the job fails with its work computed but
  # unpublished. The crons are 30 minutes apart, but discovery can run ~35
  # minutes on a slow OpenReview day, and a manual dispatch ignores the schedule
  # entirely. `cancel-in-progress: false` queues the second run instead of
  # dropping it, so no data write is ever silently skipped.
  group: data-write
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  # For the consolidated "venues not verified" issue below.
  issues: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Discover venues (current + next year, all conferences)
        id: crawl
        env:
          DEADLINE_CHANGELOG: ${{ github.workspace }}/.deadline-changes.md
          OPENREVIEW_UNVERIFIED: ${{ github.workspace }}/.unverified.tsv
          FAILED_CYCLES: ${{ github.workspace }}/.failed-cycles.tsv
        run: |
          Y=$(date -u +%Y)
          failed=""
          : > "$FAILED_CYCLES"
          for c in icml iclr neurips icra iros cvpr corl colm eccv; do
            for y in "$Y" "$((Y + 1))"; do
              # One bad cycle must not abort the crawl — a throttled or renamed
              # conference shouldn't cost the other seventeen. But it must not be
              # silent either: `|| true` alone hid a crash from 2026-08-04 to
              # 08-11, during which the 08-11 run finished 15 of 18 cycles and
              # still reported green. Collect the failures and fail at the end.
              if ! node scripts/discover_openreview.mjs --conf "$c" --year "$y"; then
                echo "::warning::discovery failed for $c $y — remaining venues in that cycle were skipped"
                failed="$failed $c-$y"
                # Recorded for the retry step below. The venue-level re-check
                # can't cover this case: the unverified list is written at the
                # END of a cycle, so a cycle that throws never appears in it.
                printf '%s\t%s\n' "$c" "$y" >> "$FAILED_CYCLES"
              fi
              # Space conferences out so OpenReview's rate budget recovers between
              # them — otherwise the burst from the first conference throttles the
              # rest and only it gets processed.
              sleep 20
            done
          done
          if [ -n "$failed" ]; then
            echo "::warning::first pass did not complete for:$failed — will retry once"
          fi
      # OpenReview allows 20 requests per 60s and says so in every response, so
      # lib/openreview.mjs paces against the advertised budget and 429s should
      # be rare. When one does slip through, the venue is recorded rather than
      # filed as "no deadline" — and by now the budget has fully recovered, so
      # a second look usually settles it.
      #
      # Re-running discovery *is* the retry: it is idempotent and it honours the
      # later-only rule and the human-edit freeze. resync_deadline.mjs would be
      # the wrong tool here — it is a maintainer override that bypasses both.
      - name: Re-check venues that could not be verified
        id: recheck
        env:
          DEADLINE_CHANGELOG: ${{ github.workspace }}/.deadline-changes.md
          OPENREVIEW_UNVERIFIED: ${{ github.workspace }}/.unverified-2.tsv
        run: |
          F="${{ github.workspace }}/.unverified.tsv"
          [ -s "$F" ] || { echo "Everything verified on the first pass."; exit 0; }
          echo "Unverified after pass 1:"; cut -f3 "$F" | sort -u | sed 's/^/  /'
          : > "$OPENREVIEW_UNVERIFIED"
          # Distinct conference-years only — one venue is enough to re-crawl its cycle.
          cut -f1,2 "$F" | sort -u | while IFS=$'\t' read -r c y; do
            echo "=== second pass: $c $y ==="
            node scripts/discover_openreview.mjs --conf "$c" --year "$y" || true
            sleep 20
          done

      - name: Retry conference-years that did not complete
        id: cycle_retry
        env:
          DEADLINE_CHANGELOG: ${{ github.workspace }}/.deadline-changes.md
          OPENREVIEW_UNVERIFIED: ${{ github.workspace }}/.unverified-2.tsv
          FAILED_CYCLES: ${{ github.workspace }}/.failed-cycles.tsv
        run: |
          # A cycle that threw — usually OpenReview answering 429 to the venue
          # listing — is retried once here rather than failing the week. By this
          # point the whole crawl and the venue re-check have run, so the rate
          # budget has had time to recover; on 2026-08-23 icra-2026 failed this
          # way and succeeded immediately on a manual re-run.
          [ -s "$FAILED_CYCLES" ] || { echo "Every conference-year completed on the first pass."; exit 0; }
          still=""
          while IFS=$'\t' read -r c y; do
            [ -n "$c" ] || continue
            echo "=== retrying $c $y ==="
            if node scripts/discover_openreview.mjs --conf "$c" --year "$y"; then
              echo "  recovered on retry"
            else
              echo "::warning::$c $y failed twice — venues in that cycle were skipped this week"
              still="$still $c-$y"
            fi
            sleep 20
          done < "$FAILED_CYCLES"
          if [ -n "$still" ]; then
            echo "failed_cycles=$still" >> "$GITHUB_OUTPUT"
            echo "::error::discovery did not complete for:$still"
          fi

      - name: Validate
        run: node scripts/validate.mjs
      # This job is the only scheduled one that CREATES entries, and it publishes
      # straight to main — so the naming guards have to run here too. Everywhere
      # else they run on pull_request (validate.yml), which would not see this
      # content until whatever unrelated PR came next, and would blame it.
      - name: Guard workshop naming (identity + venue prefixes)
        run: node scripts/acronym_identity_test.mjs
      # Validation passed above — publish directly. A failed validation fails
      # the job before anything is committed (GitHub emails the owner).
      # The commit/push/deploy-dispatch itself lives in .github/actions/publish-data.
      - name: Publish new/updated entries (if any)
        uses: ./.github/actions/publish-data
        with:
          paths: data/workshops
          subject: 'data: weekly OpenReview discovery (auto-published after validation)'
          changelog: ${{ github.workspace }}/.deadline-changes.md
          changelog-heading: 'Deadline changes synced from OpenReview (later-only):'
          nothing-message: 'No new or updated workshops this week.'
          token: ${{ github.token }}

      # Anything that failed twice becomes a consolidated issue, modelled on
      # deadline-review.yml: one issue, edited in place, and **closed when the
      # report comes back empty**. That last part is what stops it turning into
      # a stale issue every Sunday — which would be worse than the log warning
      # it replaces.
      #
      # A sibling to "Data health: deadlines to review" rather than a section
      # inside it: that one is about deadlines where OpenReview and a human
      # disagree, this one is about venues the crawler could not reach at all,
      # and the two are written by workflows on different days.
      - name: Report venues that failed twice
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const f = `${process.env.GITHUB_WORKSPACE}/.unverified-2.tsv`;
            const rows = fs.existsSync(f)
              ? fs.readFileSync(f, 'utf8').split('\n').filter(Boolean)
              : [];
            const title = 'Data health: venues not verified';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'data-health',
              per_page: 100,
            });
            const existing = open.find((i) => i.title === title);
            if (!rows.length) {
              if (existing) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  state: 'closed',
                });
              }
              return;
            }
            const seen = new Set();
            const lines = [];
            for (const r of rows) {
              const [conf, year, id, reason] = r.split('\t');
              if (seen.has(id)) continue;
              seen.add(id);
              lines.push(`- \`${id}\` — ${conf} ${year} — ${reason}`);
            }
            const body = [
              `OpenReview could not be reached for these venues on two separate passes`,
              `during the discovery run on ${new Date().toISOString().slice(0, 10)}.`,
              '',
              'Their deadlines may be stale: a lookup that fails is recorded here rather',
              'than being written as "no deadline", which is what used to happen.',
              '',
              ...lines,
              '',
              'This issue closes itself as soon as a later run verifies them all, so it',
              'needs no action unless it persists across several weeks — which would',
              'point at something other than rate limiting.',
            ].join('\n');
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['data-health'],
              });
            }

      # Runs last on purpose: whatever the crawl did find is validated and
      # published above, then the job goes red so a partial crawl is visible
      # instead of passing as green.
      - name: Fail if any conference-year did not complete
        if: steps.cycle_retry.outputs.failed_cycles != ''
        run: |
          echo "Discovery skipped venues in:${{ steps.cycle_retry.outputs.failed_cycles }} (failed on two separate passes)"
          exit 1
