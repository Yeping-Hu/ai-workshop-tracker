# Weekly: discover newly announced workshop venues on OpenReview for the
# current and next year, backfill deadlines that organizers published late, and
# keep already-imported deadlines in sync when OpenReview extends them. Whatever
# changed is validated and, on success, committed straight to main (and a deploy
# is dispatched). Per-deadline changes are recorded in the commit message. This
# is how new conference cycles (e.g. the NeurIPS list each July) and deadline
# extensions flow in with zero manual work.
name: Discover new workshop venues

on:
  schedule:
    - cron: '19 3 * * 2' # Tuesdays 03:19 UTC
  workflow_dispatch:

concurrency:
  # Serialise every workflow that commits to `main`. Each one checks out main,
  # computes, commits and pushes; if a sibling pushes in between, the push is
  # rejected as a non-fast-forward and the job fails with its work computed but
  # unpublished. The crons are 30 minutes apart, but discovery can run ~35
  # minutes on a slow OpenReview day, and a manual dispatch ignores the schedule
  # entirely. `cancel-in-progress: false` queues the second run instead of
  # dropping it, so no data write is ever silently skipped.
  group: data-write
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Discover venues (current + next year, all conferences)
        env:
          DEADLINE_CHANGELOG: ${{ github.workspace }}/.deadline-changes.md
        run: |
          Y=$(date -u +%Y)
          for c in icml iclr neurips icra iros cvpr corl colm eccv; do
            for y in "$Y" "$((Y + 1))"; do
              node scripts/discover_openreview.mjs --conf "$c" --year "$y" || true
              # Space conferences out so OpenReview's rate budget recovers between
              # them — otherwise the burst from the first conference throttles the
              # rest and only it gets processed.
              sleep 20
            done
          done
      - name: Validate
        run: node scripts/validate.mjs
      # Validation passed above — publish directly. A failed validation fails
      # the job before anything is committed (GitHub emails the owner).
      - name: Publish new/updated entries (if any)
        env:
          GH_TOKEN: ${{ github.token }}
          DEADLINE_CHANGELOG: ${{ github.workspace }}/.deadline-changes.md
        run: |
          if [ -z "$(git status --porcelain data/workshops)" ]; then
            echo "No new or updated workshops this week."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/workshops
          # Commit message: a fixed subject plus, when the bot re-synced any
          # deadlines, the per-deadline change log (old -> new) — so every
          # automated edit is recorded in history rather than applied silently.
          {
            echo "data: weekly OpenReview discovery (auto-published after validation)"
            if [ -s "$DEADLINE_CHANGELOG" ]; then
              echo
              echo "Deadline changes synced from OpenReview (later-only):"
              cat "$DEADLINE_CHANGELOG"
            fi
          } > "$RUNNER_TEMP/commit-msg.txt"
          git commit -F "$RUNNER_TEMP/commit-msg.txt"
          # Push with rebase-retry. The concurrency group above should prevent a
          # sibling data job from racing us, but a merge, an admin push or a
          # re-run can still move `main` between checkout and push — so rebase
          # onto whatever landed and try again rather than failing with the work
          # already computed.
          for attempt in 1 2 3; do
            git push && break
            if [ "$attempt" = 3 ]; then
              echo "::error::push failed after 3 attempts (main kept moving)" && exit 1
            fi
            git fetch origin main && git rebase origin/main || exit 1
            sleep $((attempt * 5))
          done
          # Pushes made with GITHUB_TOKEN don't trigger on:push workflows,
          # so kick the deploy explicitly.
          gh workflow run deploy.yml --ref main
