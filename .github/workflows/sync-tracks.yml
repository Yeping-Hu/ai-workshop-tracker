# Daily: refresh the per-track deadlines of MULTI-TRACK workshops (e.g. ECCV
# MARINE = Full + Short) from OpenReview. backfill/recheck deliberately skip
# entries with a `tracks` block and the importer only *populates* tracks when
# absent — so without this job a multi-track workshop is extracted once and then
# frozen (an added track stays blank; an extended track never catches up). This
# descends into the venue's sub-track child groups (the same subTrackInfo the
# importer uses), fills blank tracks, and applies later-only extensions per
# track, with the same freeze-on-human-edit + plausibility gates as the
# single-deadline sync. Whatever changed is validated and, on success, committed
# straight to main (and a deploy is dispatched), each change recorded in the
# commit message. First-time discovery of a new multi-track venue stays weekly
# (scripts/discover_openreview.mjs); this job only refreshes entries that already
# carry tracks.
name: Sync multi-track deadlines

on:
  schedule:
    - cron: '31 5 * * *' # daily 05:31 UTC (after backfill 05:11, before the 05:53 daily review)
  workflow_dispatch:

concurrency:
  # Serialise every workflow that commits to `main`. Each one checks out main,
  # computes, commits and pushes; if a sibling pushes in between, the push is
  # rejected as a non-fast-forward and the job fails with its work computed but
  # unpublished. The crons are 30 minutes apart, but discovery can run ~35
  # minutes on a slow OpenReview day, and a manual dispatch ignores the schedule
  # entirely. `cancel-in-progress: false` queues the second run instead of
  # dropping it, so no data write is ever silently skipped.
  group: data-write
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  sync-tracks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sync multi-track deadlines against OpenReview
        env:
          DEADLINE_CHANGELOG: ${{ github.workspace }}/.deadline-changes.md
        run: node scripts/sync_tracks.mjs
      - name: Validate
        run: node scripts/validate.mjs
      # Validation passed above — publish directly. A failed validation fails
      # the job before anything is committed (GitHub emails the owner).
      # The commit/push/deploy-dispatch itself lives in .github/actions/publish-data.
      - name: Publish updated track deadlines (if any)
        uses: ./.github/actions/publish-data
        with:
          paths: data/workshops
          subject: 'data: daily multi-track deadline sync (auto-published after validation)'
          changelog: ${{ github.workspace }}/.deadline-changes.md
          changelog-heading: 'Per-track deadline changes synced from OpenReview (later-only):'
          nothing-message: 'No multi-track deadline changes today.'
          token: ${{ github.token }}
