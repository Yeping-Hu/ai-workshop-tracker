# Monthly: re-fetch OpenReview paper caches for recent years and open a PR
# with any changes for the maintainer to review and merge.
name: Refresh OpenReview paper caches

on:
  schedule:
    - cron: '23 4 3 * *' # 3rd of each month, 04:23 UTC
  workflow_dispatch:

concurrency:
  # Serialise every workflow that commits to `main`. Each one checks out main,
  # computes, commits and pushes; if a sibling pushes in between, the push is
  # rejected as a non-fast-forward and the job fails with its work computed but
  # unpublished. The crons are staggered, but GitHub starts scheduled runs late
  # (by hours on a busy day), discovery can run ~35 minutes on a slow OpenReview
  # day, and a manual dispatch ignores the schedule entirely, so runs routinely
  # wait for one another. `cancel-in-progress: false` lets the running job
  # finish, and `queue: max` keeps every run waiting behind it: without it
  # GitHub holds ONE pending run per group and cancels it when the next one
  # queues, which silently dropped a scheduled backfill on 2026-08-14
  # (AUTOMATION.md).
  group: data-write
  cancel-in-progress: false
  queue: max

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # The branch tip when the job starts, not the commit the run was queued
      # on: a run that waited in the data-write queue must compute on top of
      # the push made by the run ahead of it (AUTOMATION.md).
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch recent venues
        run: node scripts/fetch_openreview.mjs --recent
      - name: Validate
        run: node scripts/validate.mjs
      - name: Publish cache changes (if any)
        uses: ./.github/actions/publish-data
        with:
          paths: cache/openreview
          subject: 'data: monthly paper-cache refresh (auto-published)'
          nothing-message: 'No cache changes this month.'
          token: ${{ github.token }}
