# Monthly: re-fetch OpenReview paper caches for recent years and open a PR
# with any changes for the maintainer to review and merge.
name: Refresh OpenReview paper caches

on:
  schedule:
    - cron: '23 4 3 * *' # 3rd of each month, 04:23 UTC
  workflow_dispatch:

concurrency:
  # Serialise every workflow that commits to `main`. Each one checks out main,
  # computes, commits and pushes; if a sibling pushes in between, the push is
  # rejected as a non-fast-forward and the job fails with its work computed but
  # unpublished. The crons are 30 minutes apart, but discovery can run ~35
  # minutes on a slow OpenReview day, and a manual dispatch ignores the schedule
  # entirely. `cancel-in-progress: false` queues the second run instead of
  # dropping it, so no data write is ever silently skipped.
  group: data-write
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch recent venues
        run: node scripts/fetch_openreview.mjs --recent
      - name: Validate
        run: node scripts/validate.mjs
      - name: Publish cache changes (if any)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain cache/openreview)" ]; then
            echo "No cache changes this month."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cache/openreview
          git commit -m "data: monthly paper-cache refresh (auto-published)"
          # Push with rebase-retry. The concurrency group above should prevent a
          # sibling data job from racing us, but a merge, an admin push or a
          # re-run can still move `main` between checkout and push — so rebase
          # onto whatever landed and try again rather than failing with the work
          # already computed.
          for attempt in 1 2 3; do
            git push && break
            if [ "$attempt" = 3 ]; then
              echo "::error::push failed after 3 attempts (main kept moving)" && exit 1
            fi
            git fetch origin main && git rebase origin/main || exit 1
            sleep $((attempt * 5))
          done
          gh workflow run deploy.yml --ref main
