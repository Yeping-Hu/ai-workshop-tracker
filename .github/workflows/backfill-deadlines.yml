# Daily: backfill workshops that have an OpenReview venue but no deadline yet —
# fill each `submission_deadline` the moment OpenReview publishes it, instead of
# the blank sitting on the board until the next weekly `discover` crawl. One
# direct OpenReview lookup per blank entry (no enumeration), fill-only (never
# overwrites), with the same plausibility guard as the weekly sync, and each
# filled deadline stamped bot-managed so later extensions are then caught by the
# daily imminent re-check. This is the blank-filling half of the daily upkeep;
# `recheck-imminent.yml` is the extension-catching half. Whatever is filled is
# validated and, on success, committed straight to main (and a deploy is
# dispatched), with each fill recorded in the commit message. Full venue
# discovery, multi-track descent, and legacy adoption stay weekly
# (scripts/discover_openreview.mjs); this job never enumerates and never adopts.
name: Backfill blank deadlines

on:
  schedule:
    - cron: '11 5 * * *' # daily 05:11 UTC (staggered ~30m after the imminent re-check)
  workflow_dispatch:

concurrency:
  # Serialise every workflow that commits to `main`. Each one checks out main,
  # computes, commits and pushes; if a sibling pushes in between, the push is
  # rejected as a non-fast-forward and the job fails with its work computed but
  # unpublished. The crons are 30 minutes apart, but discovery can run ~35
  # minutes on a slow OpenReview day, and a manual dispatch ignores the schedule
  # entirely. `cancel-in-progress: false` queues the second run instead of
  # dropping it, so no data write is ever silently skipped.
  group: data-write
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Backfill blank deadlines from OpenReview
        env:
          DEADLINE_CHANGELOG: ${{ github.workspace }}/.deadline-changes.md
        run: node scripts/backfill_deadlines.mjs
      - name: Validate
        run: node scripts/validate.mjs
      # Validation passed above — publish directly. A failed validation fails
      # the job before anything is committed (GitHub emails the owner).
      # The commit/push/deploy-dispatch itself lives in .github/actions/publish-data.
      - name: Publish backfilled deadlines (if any)
        uses: ./.github/actions/publish-data
        with:
          paths: data/workshops
          subject: 'data: daily blank-deadline backfill (auto-published after validation)'
          changelog: ${{ github.workspace }}/.deadline-changes.md
          changelog-heading: 'Deadlines backfilled from OpenReview:'
          nothing-message: 'No blank deadlines backfilled today.'
          token: ${{ github.token }}
