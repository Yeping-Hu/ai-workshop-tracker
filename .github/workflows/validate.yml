# Validates all workshop data on every PR (and pushes to main) that touches it.
# On PR failure, posts a human-readable comment explaining exactly what to fix.
name: Validate data

on:
  pull_request:
    paths: ['data/**', 'schema/**', 'scripts/**', 'lib/**']
  push:
    branches: [main]
    paths: ['data/**', 'schema/**', 'scripts/**', 'lib/**']

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test multi-track deadline logic
        run: node scripts/tracks_test.mjs
      - name: Test timezone normalization (import -> UTC)
        run: node scripts/tz_normalize_test.mjs
      - name: Test contributor timezone conversion (bot -> UTC)
        run: node scripts/issue_tz_test.mjs
      - name: Test deadline-sync logic (later-only, freeze-on-touch)
        run: node scripts/deadline_sync_test.mjs
      - name: Test multi-track merge policy (fill blanks, later-only per track)
        run: node scripts/sync_tracks_test.mjs
      - name: Test OpenReview website extraction (validated, shared reader)
        run: node scripts/discover_website_test.mjs
      - name: Test venue-only acronyms are dropped on import
        run: node scripts/acronym_clean_test.mjs
      - name: Test workshop short names stay unique within a conference-year
        run: node scripts/acronym_identity_test.mjs
      - name: Test the issue-form bot normalizes names, acronyms and slugs
        run: node scripts/entry_normalization_test.mjs
      - name: Test two-stage (abstract + paper) deadline handling
        run: node scripts/abstract_deadline_test.mjs
      - name: Test deadline provenance (observation log + UI derivation)
        run: node scripts/deadline_history_test.mjs
      - name: Check our own helpers are imported where they're called
        run: node scripts/imports_test.mjs
      - name: Check stored names and acronyms are already normalised
        run: node scripts/identity_fixed_point_test.mjs
      - name: Test the display-acronym rule (one shape predicate, not two)
        run: node scripts/display_acronym_test.mjs
      - name: Check one event has one name across every surface
        run: node scripts/vocabulary_test.mjs
      - name: Check the facet URL contract (one parser, board included)
        run: node scripts/facet_params_test.mjs
      - name: Test the changes-feed schema (rejects the fabricated file)
        run: node scripts/changes_feed_test.mjs
      - name: Test net-change merging (one row per workshop, both surfaces)
        run: node scripts/events_merge_test.mjs
      - name: Check the saved list renders the same row as the board
        run: node scripts/row_parity_test.mjs
      - name: Test Markdown export formatting
        run: node scripts/markdown_test.mjs
      - name: Test imminent-deadline re-check selection (band, freeze-on-touch)
        run: node scripts/recheck_imminent_test.mjs
      - name: Test deadline cross-check classifier
        run: node scripts/deadline_crosscheck_test.mjs
      - name: Test status logic (open deadline beats inferred event date)
        run: node scripts/status_test.mjs
      - name: Test edit-form transform (timezone-safe updates)
        run: node scripts/issue_edit_to_yaml_test.mjs
      - name: Check schema-docs parity
        run: node scripts/docs_sync_test.mjs
      - name: Check issue-form topic options match data/topics.yml
        run: node scripts/topic_options_sync_test.mjs
      - name: Test topic keyword matcher (title -> topics)
        run: node scripts/topics_guess_test.mjs
      - name: Test related entries (sibling tracks, other editions)
        run: node scripts/relations_test.mjs
      - name: Test official accepted-workshop list extraction
        run: node scripts/official_list_test.mjs
      - name: Test official-list reconciliation against the corpus
        run: node scripts/official_match_test.mjs
      - name: Test the sitemap reports honest per-page lastmod dates
        run: node scripts/sitemap_lastmod_test.mjs
      - name: Test issue-form field parsing
        run: node scripts/issue_form_test.mjs
      - name: Test location normalization
        run: node scripts/location_test.mjs
      - name: Test the OpenReview rate limiter
        run: node scripts/openreview_rate_test.mjs
      - name: Validate workshop data
        id: validate
        run: node scripts/validate.mjs --report validation-report.md
        continue-on-error: true
      - name: Comment validation errors on the PR
        if: steps.validate.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.existsSync('validation-report.md')
              ? fs.readFileSync('validation-report.md', 'utf8').slice(0, 60000)
              : 'Validation failed but no report was produced — check the workflow logs.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
      - name: Fail the check if validation failed
        if: steps.validate.outcome == 'failure'
        run: exit 1
