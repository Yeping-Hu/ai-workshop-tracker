<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Workshop Tracker</title>
<style>
  :root {
    --paper: #f8f9f7;
    --surface: #ffffff;
    --ink: #161a16;
    --muted: #5a6258;
    --line: #e2e5df;
    --accent: #1e5c45;
    --accent-soft: #e5f0ea;
    --urgent: #b3261e;
    --font-display: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, 'Times New Roman', serif;
    --font-body: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    --font-mono: ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #14181300; --surface: #1a1e19; --ink: #eceee8; --muted: #9aa294;
      --line: #2a2f28; --accent: #6fbf9b; --accent-soft: #1e3329; --urgent: #f2766b;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font-body);
    color: var(--ink);
    background:
      radial-gradient(120% 90% at 85% 12%, var(--accent-soft) 0%, transparent 55%),
      var(--paper);
    min-height: 100%;
    display: flex; align-items: center; justify-content: center;
    padding: 5vmin;
    -webkit-font-smoothing: antialiased;
  }

  /* 16:9 slide canvas that scales to the viewport */
  .slide {
    width: min(100%, 168vh);
    aspect-ratio: 16 / 9;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 24px 60px -28px rgba(20, 40, 30, 0.35);
    padding: clamp(2.2rem, 6vh, 5.5rem) clamp(2.5rem, 6vw, 6rem);
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: clamp(1rem, 2.6vh, 2.2rem);
    overflow: hidden;
    position: relative;
  }
  /* upper area: left-aligned text on the left, QR on the right */
  .hero {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: clamp(2rem, 5vw, 5rem);
  }

  /* row 1: wordmark */
  .brand {
    display: flex; align-items: center; gap: 0.6rem;
    font-family: var(--font-display);
    font-size: clamp(1.1rem, 2.4vh, 1.7rem);
    letter-spacing: -0.01em;
  }
  .brand .mark { width: 1.1em; height: 1.1em; flex: none; color: var(--accent); }
  .brand b { font-weight: 600; }
  .brand .tail { color: var(--accent); font-weight: 600; }

  /* row 2 left: the pitch */
  .pitch { max-width: 30ch; flex: 0 1 auto; }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: clamp(0.62rem, 1.4vh, 0.8rem);
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--accent); margin-bottom: clamp(0.6rem, 1.6vh, 1.1rem);
  }
  h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(2rem, 6.4vh, 4.4rem);
    line-height: 1.02; letter-spacing: -0.02em;
  }
  h1 .em { color: var(--accent); }
  .sub {
    margin-top: clamp(0.8rem, 2vh, 1.5rem);
    font-size: clamp(0.95rem, 2.2vh, 1.4rem);
    color: var(--muted); line-height: 1.4;
  }

  /* row 2 right: QR + url */
  .visit {
    text-align: center; flex: none;
    display: flex; flex-direction: column; align-items: center;
    gap: clamp(0.5rem, 1.4vh, 1rem);
  }
  .qr {
    width: clamp(120px, 22vh, 230px); height: auto;
    padding: clamp(0.5rem, 1.2vh, 0.9rem);
    background: #fff;
    border: 1px solid var(--line); border-radius: 12px;
    display: block;
  }
  .visit .url {
    font-family: var(--font-mono);
    font-size: clamp(0.85rem, 2.1vh, 1.35rem);
    font-weight: 600; color: var(--ink);
  }
  .visit .scan {
    font-size: clamp(0.62rem, 1.4vh, 0.8rem);
    color: var(--muted); letter-spacing: 0.02em;
  }

  /* row 3: signature countdown strip + benefits */
  .foot {
    align-self: stretch;
    border-top: 1px solid var(--line);
    padding-top: clamp(0.9rem, 2.2vh, 1.6rem);
    display: flex; align-items: center; justify-content: flex-start;
    gap: 1.5rem; flex-wrap: wrap;
  }
  .next { display: flex; align-items: baseline; gap: 0.7rem; min-width: 0; }
  .next .lbl {
    font-family: var(--font-mono);
    font-size: clamp(0.6rem, 1.3vh, 0.76rem);
    letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted);
    flex: none;
  }
  .next .clock {
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: clamp(0.95rem, 2.3vh, 1.5rem);
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .next .clock.soon { color: var(--urgent); }
  .next .wsname {
    font-size: clamp(0.72rem, 1.6vh, 1rem);
    color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .benefits {
    display: flex; gap: clamp(0.8rem, 2vw, 1.8rem);
    font-size: clamp(0.72rem, 1.6vh, 1rem);
    color: var(--ink); flex: none;
  }
  .benefits span { display: flex; align-items: center; gap: 0.45rem; white-space: nowrap; }
  .benefits .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; }

  @media (max-width: 640px) {
    .slide { aspect-ratio: auto; min-height: 90vh; grid-template-columns: 1fr; }
    .visit { justify-self: center; margin-top: 1.5rem; }
    .foot { flex-direction: column; align-items: flex-start; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
