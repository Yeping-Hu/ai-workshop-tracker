# Controlled topic vocabulary. Workshops reference these by `id`.
# Keep this list broad; propose additions via PR.
#
# `description` is what Jev reads when it tags an imported workshop
# (lib/jev_topics.mjs) and when the paper matcher asks which topics a pasted
# paper is about (alerts/fit.mjs; it travels in /api/match-candidates.json).
# The label alone is too terse for a literal reader —
# "Efficiency" or "ML systems" says little about what counts — so each one
# names the concrete subjects it covers. Not shown on the site; the labels are.
#
# Three rules, each learned on the corpus (docs/ARCHITECTURE.md, "Contributors
# are validated by CI", has the numbers):
#   - A topic earns its place with at least three workshops; validate.mjs warns
#     when one falls below. A subject with fewer is a wider topic's description.
#   - An `id` is forever: it is in calendar-feed URLs and in subscribers' saved
#     choices. A `label` is in shared filter links (?topic=<label>), so rename
#     one only when the old name has become wrong.
#   - A description is tuned against every entry, not one. Jev judges each
#     topic's question on its own, so rewording one means re-asking that one
#     question corpus-wide and reading what moved — "Robot Learning" read as
#     reinforcement learning on 36 CoRL workshops until the description said
#     what does not count.
- { id: affinity,                 label: "Affinity & community",       description: "workshops organized by and for a community of researchers rather than around a subject, open to work from every area of AI: Women in ML, LatinX in AI, Black in AI, Queer in AI, Muslims in ML, Global South and regional AI communities, newcomers to the field" }
