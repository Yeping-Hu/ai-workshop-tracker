# ============================================================
# Workshop template — copy this file to:
#   data/workshops/<conference>-<year>-<short-slug>.yml
#   e.g. data/workshops/neurips-2026-math-ai.yml
# Delete comments you don't need. Fields marked (required) must be set.
# ============================================================

name: ""                       # (required) full official name, WITHOUT the conference/year.
                               #   yes: "Workshop on Machine Learning for Health"
                               #   no:  "NeurIPS 2026 Workshop on Machine Learning for Health"
                               #   Every page showing it already says the conference-year.
acronym: ""                    # short name, e.g. "MATH-AI"; leave "" if none.
                               # No conference/year ("MATH-AI", not "MATH-AI @ NeurIPS 2026"),
                               # and no track suffix — sibling tracks are labelled
                               # automatically from openreview_venue_id.
conference: neurips            # (required) one of the ids in data/conferences.yml
year: 2026                     # (required)
website: "https://"            # (required) official workshop website
# location: "Sydney, Australia" # (optional) filled by the weekly OpenReview sync
topics: [other]                # (required) 1-5 ids from data/topics.yml

# --- Deadlines (strongly encouraged) ---
submission_deadline: ""        # "YYYY-MM-DD HH:MM" or "YYYY-MM-DD" (= 23:59)
timezone: "AoE"                # "AoE" (default), "UTC", or IANA e.g. "America/Los_Angeles"
deadline_notes: ""             # e.g. "extended from Aug 15"
# Two-stage venues only: a MANDATORY abstract registration before the paper
# deadline above. Always UTC. submission_deadline stays the PAPER deadline, so
# the countdown never jumps forward and look like an extension.
# abstract_deadline: "2026-08-20 00:00"
# Bot-maintained: append-only log of observed deadline values, written by the
# OpenReview sync. Leave this out when adding a workshop by hand.
# deadline_history:
#   - { value: "2026-08-05 00:00", recorded: "2026-07-28", timezone: "UTC" }
#   - { value: "2026-08-12 00:00", recorded: "2026-08-02", timezone: "UTC" }
notification_date: ""          # "YYYY-MM-DD"
workshop_date: ""              # "YYYY-MM-DD"
# Multi-track workshops only (tracks with DIFFERENT deadlines, e.g. Full + Short).
# Omit entirely for a single deadline. Headline = soonest open track; a track
# with no submission_deadline shows as "not yet announced".
# tracks:
#   - { name: "Full",  submission_deadline: "2026-07-13 12:00", timezone: "UTC" }
#   - { name: "Short" }   # deadline not announced yet

# --- Papers, and the series identity ---
openreview_venue_id: ""        # e.g. "NeurIPS.cc/2026/Workshop/MATH-AI" -> auto paper list,
                               # AND the key that links this entry to the other editions of the
                               # same workshop: the trailing short name is matched across years
                               # within one conference. Without it, "Other editions" stays empty.
# merged_venue_ids:              # other OpenReview ids that are this same workshop (their old URLs redirect here)
#   - "IEEE.org/IROS/2026/Workshop/Alt-Group"   # keeps discovery from re-creating a duplicate
proceedings_url: ""            # for non-OpenReview workshops: their accepted-papers page
submission_portal: unknown     # openreview | cmt | email | other | unknown
# Where authors actually submit, when that is NOT OpenReview. An
# openreview_venue_id already produces its own submission link, so leave this
# empty for those; without it a `cmt` portal renders as the bare word "CMT"
# with nothing to click.
# submission_url: "https://cmt3.research.microsoft.com/EXAMPLE2026"

# --- Optional ---
organizers: []
previous_editions: []          # - { year: 2025, website: "https://...", proceedings_url: "https://..." }
notes: ""
added: ""                      # "YYYY-MM-DD" (date this entry was added)
# Records an OpenReview value you reviewed and chose NOT to adopt, so the weekly
# review stops reporting it. It stores the rejected value, not a blanket mute: if
# OpenReview changes to something different later, you are told again.
# review_ack:
#   name: "The OpenReview title you declined"
#   website: "https://the-openreview-url-you-declined.example"
#   submission_deadline: "2026-08-07 20:59"   # a deadline move you reviewed and declined
#   official_list: "https://blog.example.cc/announcing-the-2026-workshops/"
#     # ^ the accepted-workshop list you checked when confirming this entry is
#       legitimately absent from it (an affinity event, a competition, a
#       co-located workshop). Records the list reviewed, not a blanket mute.

# This edition is NOT taking place — most often because the conference's official
# accepted-workshop list does not include it. OpenReview creates a venue group
# during the PROPOSAL phase, so a rejected proposal keeps a live group with an
# open submission invitation and a ticking deadline, and discovery cannot tell it
# from an accepted one. The entry keeps its file and page (deleting it does not
# work — the next weekly crawl re-creates it) but stops being an Open call, stops
# feeding alerts, and is frozen against every deadline sync.
# Set it with `node scripts/mark_not_running.mjs --slug <slug> --reason <reason>`.
# not_running:
#   reason: not_on_official_list   # not_on_official_list | withdrawn | cancelled
#   recorded: "2026-08-28"         # the date WE observed it, not when it was decided
#   source: "https://blog.example.cc/announcing-the-2026-workshops/"
#   note: "One line shown to a reader under the notice on the workshop page." 
